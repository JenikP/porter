name: Porter launch checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  marketplace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: porter_test
          POSTGRES_USER: porter_test
          POSTGRES_PASSWORD: ci-disposable-database
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U porter_test -d porter_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTER_TEST_DATABASE_URL: postgres://porter_test:ci-disposable-database@127.0.0.1:5432/porter_test
      PORTER_PLAYWRIGHT_PATH: playwright
      PORTER_BROWSER_CHANNEL: chromium
      PORTER_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:providers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-browser-evidence
          path: docs/progress/launch/
